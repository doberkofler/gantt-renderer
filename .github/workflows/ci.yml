name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast static checks that run in parallel with browser tests.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run lint
      - run: pnpm run lint:css

  # Builds the library and runs browser-based unit tests with Playwright browsers
  # installed from the package version resolved by pnpm.
  test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - run: pnpm exec playwright install --with-deps

      - run: pnpm run build:lib

      - run: pnpm run build

      - run: pnpm run test
        env:
          CI: true

      - uses: coverallsapp/github-action@v2

  # End-to-end Playwright tests that drive a live dev server against the demo
  # page across Chromium, Firefox, and WebKit.
  integration-test:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - run: pnpm exec playwright install --with-deps

      - run: pnpm run integration-test
        env:
          CI: true

  # Deploys the demo site to GitHub Pages on pushes to main.
  # Prerequisite: GitHub Pages must be enabled in the repo settings.
  # → Settings > Pages > Source: "GitHub Actions"
  # Without Pages enabled this job fails gracefully (continue-on-error).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integration-test]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run build --base=/gantt-renderer/
      - run: pnpm run docs:api
      - run: mkdir -p dist-demo/docs && mv docs/api dist-demo/docs/api

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo

      - id: deployment
        uses: actions/deploy-pages@v5
